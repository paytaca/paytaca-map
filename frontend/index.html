<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/paytaca_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#EFF6FF">

    <!-- Apply saved color scheme before paint to avoid a flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0B1220');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- HTML Meta Tags -->
    <title>Paytaca Map</title>
    <meta name="description" content="The Paytaca Merchant Map is an interactive tool that helps users discover businesses accepting Bitcoin Cash (BCH) through Paytaca. It stands out with its auto-updating latest transaction timestamps, giving users a reliable view of active merchants and real-world crypto adoption.">

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://map.paytaca.com">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Paytaca Map">
    <meta property="og:description" content="The Paytaca Merchant Map is an interactive tool that helps users discover businesses accepting Bitcoin Cash (BCH) through Paytaca. It stands out with its auto-updating latest transaction timestamps, giving users a reliable view of active merchants and real-world crypto adoption.">
    <meta property="og:image" content="https://map.paytaca.com/preview.png">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="map.paytaca.com">
    <meta property="twitter:url" content="https://map.paytaca.com">
    <meta name="twitter:title" content="Paytaca Map">
    <meta name="twitter:description" content="The Paytaca Merchant Map is an interactive tool that helps users discover businesses accepting Bitcoin Cash (BCH) through Paytaca. It stands out with its auto-updating latest transaction timestamps, giving users a reliable view of active merchants and real-world crypto adoption.">
    <meta name="twitter:image" content="https://map.paytaca.com/preview.png">

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
